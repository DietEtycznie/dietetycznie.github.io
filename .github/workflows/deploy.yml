name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate environment.ts from secret (or safe fallback)
        run: |
          mkdir -p src/environments
          if [ -n "$ENV_PRD" ]; then
            echo "$ENV_PRD" > src/environments/environment.ts
          else
            cp src/environments/environment.example.ts src/environments/environment.ts
          fi
        env:
          ENV_PRD: ${{ secrets.ENV_PRD }}

      - name: Build Angular app
        run: npm run build -- --base-href=/

      - name: Add SPA 404 fallback for GitHub Pages
        run: cp dist/demo/index.html dist/demo/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/demo
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
