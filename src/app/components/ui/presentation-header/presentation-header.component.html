<section class="presentation-header">
  <div class="container presentation-header__inner">
    <div class="presentation-header__art" aria-hidden="true">
      <div class="presentation-header__glow"></div>
      <img
        src="assets/presentation-header-cutout.png"
        alt=""
        class="presentation-header__img"
      />
    </div>
    <div class="presentation-header__copy">
      <h1>{{ title }}</h1>
      @if (description) {
        <p>{{ description }}</p>
      }
    </div>
    <div class="presentation-header__actions">
      <ng-content></ng-content>
    </div>
  </div>
</section>
