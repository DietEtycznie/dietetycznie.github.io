<div class="dialog-box">
  <div class="dialog-head">
    <h2>Nowy jadłospis</h2>
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Zamknij">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form class="dialog-form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="planName">Nazwa jadłospisu *</label>
      <input
        id="planName"
        type="text"
        class="form-control"
        [(ngModel)]="newDietPlan.name"
        name="name"
        placeholder="np. Mój plan tygodniowy 1800 kcal"
        required
      />
    </div>

    <div class="field">
      <label for="planDesc">Opis i cel planu</label>
      <textarea
        id="planDesc"
        class="form-control"
        [(ngModel)]="newDietPlan.description"
        name="description"
        rows="3"
        placeholder="Krótki opis np. dieta przeciwzapalna na dni robocze..."
      ></textarea>
    </div>

    <div class="field">
      <label>Dopasuj do chorób (opcjonalnie)</label>
      <div class="cond-chips">
        @for (cond of allConditions; track cond) {
          <button
            type="button"
            class="cond-chip"
            [class.is-active]="newDietPlan.suitableForConditions?.includes(cond)"
            (click)="toggleCondition(cond)"
          >
            {{ cond }}
          </button>
        }
      </div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Anuluj</button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!newDietPlan.name?.trim()"
      >
        Utwórz i przejdź do edycji
      </button>
    </div>
  </form>
</div>
