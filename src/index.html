<!doctype html>
<html lang="pl">
  <head>
    <title>DietEtycznie — Spersonalizowane diety i przepisy dla zdrowia</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Znajdź odpowiednią dietę dla swojego stanu zdrowia. Spersonalizowane 7-dniowe jadłospisy, przepisy z pełnym makro i zalecenia dla chorób dietozależnych."
    />
    <meta name="theme-color" content="#fffefc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DietEtycznie" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("dietetycznie_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
            var tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.setAttribute("content", "#0e1613");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="mat-typography">
    <app-root>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          text-align: center;
          background: var(--bg-page, #f6f9f7);
          font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;
        "
      >
        <div>
          <div
            class="logo-div"
            style="background-position: center; height: 48px; margin-bottom: 12px"
          ></div>
          <p style="color: var(--ink-secondary, #4f635a); font-size: 0.95rem">
            Ładowanie spersonalizowanych planów żywieniowych...
          </p>
        </div>
      </div>
    </app-root>
  </body>
</html>
